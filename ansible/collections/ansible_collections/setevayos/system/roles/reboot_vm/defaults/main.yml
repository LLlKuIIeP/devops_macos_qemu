---
# Режим работы роли:
#   always       — перезагружать всегда
#   if_required  — только если есть /var/run/reboot-required (Ubuntu/Debian)
#   never        — не перезагружать (проверка без действия)
reboot_mode: "always"

# Сообщение, которое увидят пользователи перед перезагрузкой
reboot_message: "Reboot initiated by Ansible"

# Задержка ПЕРЕД отправкой reboot (сек).
# Полезно, чтобы дать процессам время корректно завершиться.
reboot_pre_delay: 2

# Задержка ПОСЛЕ перезагрузки (сек), прежде чем начинать проверки.
# Полезно для QEMU-ВМ, где сеть может подниматься с задержкой.
reboot_post_delay: 10

# Сколько секунд ждать, пока машина снова станет доступна
reboot_timeout: 600

# Таймаут попытки SSH-подключения при проверке (сек)
reboot_connect_timeout: 10

# Команда, которой проверяется "живость" системы после перезагрузки
reboot_test_command: "whoami"

# Путь к файлу-индикатору необходимости перезагрузки (Ubuntu/Debian)
reboot_required_file: "/var/run/reboot-required"
